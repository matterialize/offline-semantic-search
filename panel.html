<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline Semantic Search</title>
  <link rel="icon" href="/icons/icon-32.png">
  <script type="module" src="/src/panel.ts"></script>
</head>
<body>
  <main class="panel" aria-label="Search this page">
    <header>
      <h1>Find on this page</h1>
      <button class="icon-button" id="close" aria-label="Close search" title="Close search (Escape)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </header>
    <form role="search" id="search-form">
      <label class="sr-only" for="query">What are you looking for?</label>
      <div class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="query" type="search" placeholder="Describe what you’re looking for…" autocomplete="off" spellcheck="false" enterkeyhint="search">
      </div>
    </form>
    <div class="result-toolbar">
      <p id="status" role="status" aria-live="polite">Search by meaning, in your own words.</p>
      <div class="navigation" hidden>
        <span id="position" aria-live="polite"></span>
        <button class="icon-button" id="previous" aria-label="Previous result" title="Previous result (Shift+Enter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button>
        <button class="icon-button" id="next" aria-label="Next result" title="Next result (Enter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button>
      </div>
    </div>
    <div id="results-scroll" tabindex="-1"><ol id="results" aria-label="Closest matches"></ol><div id="sentinel" aria-hidden="true"></div></div>
    <p id="coverage" hidden></p>
    <button id="retry" hidden>Try again</button>
    <footer class="product-info"><a href="https://github.com/matterialize/offline-semantic-search" target="_blank" rel="noopener noreferrer">Free &amp; open source</a><a href="https://github.com/matterialize/offline-semantic-search/blob/main/docs/PRIVACY.md" target="_blank" rel="noopener noreferrer">Privacy</a></footer>
  </main>
</body>
</html>
